<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bot Configurator</title>
  <link href="./output.css" rel="stylesheet">
  <script type="module" src="./guildconfig.js" defer></script>
  <script type="module" defer>
                  const tabs = document.querySelectorAll('.tab-btn:not(.subtab-btn)');
                  const tabContents = document.querySelectorAll('.tab-content');
    tabs.forEach(tab => {
      tab.addEventListener('click', () => {
        tabs.forEach(item => item.classList.remove('tab-btn-active'));
        tabContents.forEach(content => content.classList.add('hidden'));
        const targetId = tab.getAttribute('data-target');
        document.getElementById(targetId).classList.remove('hidden');
        tab.classList.add('tab-btn-active');
      });
    });
    document.getElementById('modChannelsTab').click();
  </script>
  <script type="module" defer>
    const subtabs = document.querySelectorAll('.subtab-btn');
    const subtabContents = document.querySelectorAll('.subtab-content');
    subtabs.forEach(tab => {
      tab.addEventListener('click', () => {
        subtabs.forEach(item => item.classList.remove('tab-btn-active'));
        subtabContents.forEach(content => content.classList.add('hidden'));
        const targetId = tab.getAttribute('data-subtarget');
        document.getElementById(targetId).classList.remove('hidden');
        tab.classList.add('tab-btn-active');
      });
    });
  </script>
</head>

<body class="bg-gray-900 text-gray-100 p-4 bg-gray-800 rounded-xl shadow-lg p-6 space-y-6">
  <h1 class="text-3xl font-bold text-blue-400 justify-center"> Bot Configuration</h1>
  <h2 class="text-3xl font-semibold text-red-400 justify-center">All edits are only kept locally until you hit save.
  </h2>
      <!-- Guild Selection -->
      <div class="panel flex justify-between">
        <select id="guildSelect" class="field-full focus:ring-blue-500 focus:border-blue-500 cursor-pointer">
          <option value="">-- Select a Guild --</option>
        </select>
        <span id="orText" class="text-gray-300 font-semibold py-2 2em">- or -</span>
        <button id="addToServerBtn" class="auth-btn bg-indigo-500 hover:bg-indigo-600">Add to Server</button>
      </div>
        <!-- Auth -->
        <div class="panel flex items-center justify-between">
          <span id="authStatus" class="text-gray-300">Checking login status...</span>
          <div>
            <button id="loginBtn" class="auth-btn hidden bg-indigo-500 hover:bg-indigo-600">Login with
              Discord</button>
            <button id="logoutBtn" class=" auth-btn hidden bg-gray-500 hover:bg-gray-600">Logout</button>
          </div>
      </div>

      <!-- Action Buttons-->
      <div class="flex justify-between items-center mt-6">
        <button id="saveConfigBtn" class="action-btn bg-green-500 hover:bg-green-600">Save</button>
        <button id="deleteConfigBtn" class="action-btn bg-red-500 hover:bg-red-600">Delete Guild</button>
        <button id="downloadConfigBtn" class="action-btn bg-blue-500  hover:bg-blue-600">Export Backup(JSON)</button>
      </div>
      <!--Config tabs-->
      <div id="channelsContainer" class="space-y-6">
        <div class="flex border-b border-gray-600">
          <button id="modChannelsTab" class="tab-btn" data-target="modChannelsContent">Log Channels</button>
          <button id="autoModTab" class="tab-btn" data-target="autoModContent">AutoMod Settings</button>
          <button id="publicChannelsTab" class="tab-btn" data-target="publicChannelsContent">Public Channels</button>
          <button id="GeneralTab" class="tab-btn" data-target="GeneralContent">General Channels</button>
          <button id="reactionsTab" class="tab-btn" data-target="reactionsContent">Reactions</button>
          <button id="StaffRoles" class="tab-btn " data-target="StaffRolesContent">Staff Roles</button>
          <button id="stringReactionsTab" class="tab-btn" data-target="stringReactionsContent">String Reactions</button>
          <button id="EmbedContentTab" class="tab-btn" data-target="embedContent">Embeds</button>
        </div>
        <div id="tabContentContainer" class="space-y-6">
          <div id="modChannelsContent" class="tab-content bg-gray-700 p-4 rounded-xl space-y-4 shadow-inner hidden">
            <div id="modChannelsSection"></div>
        </div>
          <div id="publicChannelsContent" class="tab-content bg-gray-700 p-4 rounded-xl space-y-4 shadow-inner hidden">
            <div id="publicChannelsSection"></div>
            <button id="addPublicChannelBtn" class="add-btn"> Add Public Channel </button>
            </div>
          <div id="GeneralContent" class="tab-content bg-gray-700 p-4 rounded-xl space-y-4 shadow-inner hidden">
            <span class="text-blue-400">First entry will be your channel for announcing users who join.</span>
            <div id="GeneralChannelsSection"></div>
            <button id="addMediaBtn" class="add-btn">Add General Channel</button>
          </div>
          <div id="reactionsContent" class="tab-content bg-gray-700 p-4 rounded-xl space-y-4 shadow-inner hidden">
            <div id="reactionSection"></div>
            <button id="addReactionBtn" class="add-btn"> Add Reaction</button>
            </div>
          <div id="stringReactionsContent" class="tab-content bg-gray-700 p-4 rounded-xl space-y-4 shadow-inner hidden">
            <div id="stringSection"></div>
            <button id="addStringBtn" class="add-btn">Add String Reaction</button>
            </div>
            <div id="embedContent" class="tab-content bg-gray-700 p-4 rounded-xl space-y-4 shadow-inner hidden">
              <div id="embedContentSection"></div>
            </div>
            <div id="StaffRolesContent" class="tab-content bg-gray-700 p-4 rounded-xl space-y-4 shadow-inner hidden">
              <div class="flex flex-col gap-4">
                <span class="field-label text-red-400">Admin Role ID</span>
                <input type="text" id="adminRoleInput" placeholder="Admin Role ID" class="field">
                <span class="field-label text-red-400">Mod Role ID</span>
                <input type="text" id="modRoleInput" placeholder="Mod Role ID" class="field">
                <span class="field-label">Jr Role ID</span>
                <input type="text" id="jrRoleInput" placeholder="Jr Role ID" class="field">
              </div>
            </div>
            <div id="autoModContent" class="tab-content bg-gray-700 p-4 rounded-xl space-y-4 shadow-inner hidden">
              <div class="flex border-b border-gray-600">
                <button id="automodSettingsSubtab" class="subtab-btn tab-btn tab-btn-active"
                  data-subtarget="automodSettingsSubcontent">General Settings</button>
                <button id="automodWeightsSubtab" class="subtab-btn tab-btn" data-subtarget="automodWeightsSubcontent">Reasons &amp;
                  Weights</button>
              </div>
          <div id="automodSettingsSubcontent" class="subtab-content space-y-4">
            <div id="AutomodSection"></div>
          </div>
  <div id="automodWeightsSubcontent" class="subtab-content space-y-4 hidden">
    <div id="reasonsWeightsSection" class="space-y-2"></div>
    <button id="addReasonWeightBtn" class="add-btn">Add Rule Weight</button>
  </div>
  </div>
<!-- Message Error Display-->
<div id="messageBox" class="text-center p-3 rounded-lg hidden"></div>

</body>

</html>
